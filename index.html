<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoodChip Control | ระบบบริหารจัดการไม้สับ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<style>
:root{
  --navy:#0d1b2a; --navy-2:#132a40; --navy-3:#1b3a56;
  --amber:#f59e0b; --amber-h:#d97706; --amber-glow:rgba(245,158,11,.12);
  --green:#10b981; --green-bg:rgba(16,185,129,.1);
  --red:#ef4444; --red-bg:rgba(239,68,68,.1);
  --blue:#3b82f6; --blue-bg:rgba(59,130,246,.1);
  --purp:#a78bfa; --purp-bg:rgba(167,139,250,.1);
  --warn:#f97316; --warn-bg:rgba(249,115,22,.1);
  --ink:#e8edf3; --ink-dim:#93a3b8; --ink-dim2:#5a7089; --line:#26405c;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
  --font-head:'Barlow Condensed',sans-serif; --font-body:'Barlow',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
body.light-theme{
  --navy:#eef1f5; --navy-2:#ffffff; --navy-3:#f3f5f8;
  --amber:#b45309; --amber-h:#92400e; --amber-glow:rgba(180,83,9,.12);
  --green:#047857; --green-bg:rgba(4,120,87,.08);
  --red:#dc2626; --red-bg:rgba(220,38,38,.08);
  --blue:#1d4ed8; --blue-bg:rgba(29,78,216,.08);
  --purp:#7c3aed; --purp-bg:rgba(124,58,237,.08);
  --warn:#c2410c; --warn-bg:rgba(194,65,12,.08);
  --ink:#1a2332; --ink-dim:#5b6b7d; --ink-dim2:#8896a3; --line:#dde3ea;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--navy);color:var(--ink);font-family:var(--font-body);min-height:100vh;font-size:14px;transition:background .2s,color .2s;}
h1,h2,h3,.headfont{font-family:var(--font-head);font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
.mono{font-family:var(--font-mono);}
a{color:inherit;}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}

/* ---------- Loading ---------- */
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box{text-align:center;padding:60px;color:var(--ink-dim);}
.loading-box .spin{margin:0 auto 12px;}

/* ---------- Login ---------- */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 20%, rgba(245,158,11,.08), transparent 40%),
  radial-gradient(circle at 80% 80%, rgba(16,185,129,.08), transparent 40%), var(--navy);}
.login-box{width:380px;background:var(--navy-2);border:1px solid var(--line);border-radius:12px;padding:36px;box-shadow:0 24px 64px rgba(0,0,0,.45);}
.login-box h1{font-size:28px;margin:0 0 4px;color:var(--amber);}
.login-box .sub{color:var(--ink-dim);font-size:13px;margin-bottom:26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.field input,.field select{width:100%;padding:10px 12px;background:var(--navy);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-size:14px;font-family:var(--font-mono);}
.field input:focus,.field select:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-glow);}
.btn{padding:10px 18px;border-radius:7px;border:none;font-weight:700;font-size:13px;font-family:var(--font-head);text-transform:uppercase;letter-spacing:.04em;}
.btn-primary{background:var(--amber);color:var(--navy);width:100%;}
.btn-primary:hover{background:var(--amber-h);}
.btn-secondary{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-secondary:hover{background:var(--navy-3);}
.btn-danger{background:var(--red);color:#fff;}
.btn-sm{padding:6px 12px;font-size:11px;}
.err-msg{background:var(--red-bg);border:1px solid var(--red);color:#fca5a5;padding:9px 12px;border-radius:7px;font-size:13px;margin-bottom:14px;}
.ok-msg{background:var(--green-bg);border:1px solid var(--green);color:#6ee7b7;padding:9px 12px;border-radius:7px;font-size:13px;margin-bottom:14px;}

/* ---------- App shell ---------- */
#app-shell{display:none;min-height:100vh;grid-template-columns:230px 1fr;grid-template-rows:60px 1fr;}
#app-shell.active{display:grid;}
#topbar{grid-column:1/3;background:var(--navy-2);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:50;}
#topbar .brand{font-family:var(--font-head);font-weight:700;color:var(--amber);letter-spacing:.05em;font-size:16px;}
#topbar .user-info{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-dim);}
.role-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid;}
.role-ENG{background:rgba(59,130,246,.15);color:#93c5fd;border-color:#3b82f6;}
.role-PUR{background:rgba(167,139,250,.15);color:#c4b5fd;border-color:#a78bfa;}
.role-STO{background:rgba(16,185,129,.15);color:#6ee7b7;border-color:#10b981;}
.role-PRD{background:rgba(245,158,11,.15);color:#fcd34d;border-color:#f59e0b;}
.role-SUP{background:rgba(236,72,153,.15);color:#f9a8d4;border-color:#ec4899;}
.role-ADMIN{background:rgba(239,68,68,.15);color:#fca5a5;border-color:#ef4444;}
#sidebar{background:var(--navy-2);border-right:1px solid var(--line);padding:14px 0;overflow-y:auto;}
#sidebar .nav-grp{font-size:10px;font-weight:700;color:var(--ink-dim2);text-transform:uppercase;letter-spacing:.08em;padding:14px 20px 6px;}
#sidebar a{display:flex;align-items:center;gap:9px;padding:10px 20px;font-size:14px;color:var(--ink-dim);text-decoration:none;border-left:3px solid transparent;}
#sidebar a:hover{color:var(--ink);background:rgba(255,255,255,.03);}
#sidebar a.active{color:var(--amber);border-left-color:var(--amber);background:rgba(245,158,11,.06);font-weight:600;}
#content{padding:24px;overflow-y:auto;}
.page-title{font-size:22px;margin:0 0 20px;color:var(--ink);}

/* ---------- Cards / stats ---------- */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.dash-top{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:stretch;}
.dash-stats-col{display:flex;flex-direction:column;gap:12px;}
.dash-pile-card{display:flex;flex-direction:column;}
body.mobile-mode .dash-top{grid-template-columns:1fr;}
.grid-2{grid-template-columns:1fr 1fr;}
.card{background:var(--navy-2);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow);}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);}
.card-title{font-family:var(--font-head);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0;}
.stat{position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.stat.amber::before{background:var(--amber);} .stat.green::before{background:var(--green);}
.stat.blue::before{background:var(--blue);} .stat.red::before{background:var(--red);} .stat.purp::before{background:var(--purp);}
.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);margin-bottom:8px;font-weight:600;}
.stat .value{font-family:var(--font-mono);font-size:24px;font-weight:700;}
.stat .value .unit{font-size:12px;color:var(--ink-dim);margin-left:4px;font-weight:400;}
.stat .sub{font-size:11px;color:var(--ink-dim);margin-top:5px;}

/* ---------- Stock gauge ---------- */
.stock-bar{height:14px;background:var(--navy);border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:10px 0 6px;}
.stock-fill{height:100%;transition:width .4s;}
.sf-crit{background:var(--red);} .sf-low{background:var(--warn);} .sf-ok{background:var(--green);} .sf-high{background:var(--blue);}
.stock-marks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-dim);}
.badge{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;}
.badge-ok{background:var(--green-bg);color:#6ee7b7;} .badge-warn{background:var(--warn-bg);color:#fdba74;}
.badge-err{background:var(--red-bg);color:#fca5a5;} .badge-info{background:var(--blue-bg);color:#93c5fd;}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--ink-dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid rgba(38,64,92,.5);font-family:var(--font-mono);}
tr:hover td{background:rgba(255,255,255,.02);}
.badge-over{color:var(--warn);font-weight:700;}
.row-del{background:transparent;border:none;color:var(--ink-dim2);font-size:14px;padding:2px 6px;border-radius:4px;}
.row-del:hover{color:var(--red);background:var(--red-bg);}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line);}
.tab{padding:9px 18px;font-size:13px;color:var(--ink-dim);border-bottom:2px solid transparent;cursor:pointer;font-weight:600;}
.tab.active{color:var(--amber);border-bottom-color:var(--amber);}
.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:16px;}
.toolbar .field{margin-bottom:0;min-width:140px;}
.section-gap{margin-top:24px;}
.hint{font-size:12px;color:var(--ink-dim);margin-top:6px;}
.chart-wrap{position:relative;height:230px;}

/* ---------- Paste zone ---------- */
.paste-zone{background:var(--navy);border:2px dashed var(--line);border-radius:8px;padding:12px;margin-top:10px;}
.paste-zone.hide{display:none;}
.hide{display:none !important;}

/* ---------- Mobile Mode (toggle-able, also auto-detects narrow screens) ---------- */
body.mobile-mode #app-shell{grid-template-columns:1fr;grid-template-rows:52px 44px 1fr;}
body.mobile-mode #topbar{grid-column:1;}
body.mobile-mode #sidebar{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:4px 6px;gap:2px;-webkit-overflow-scrolling:touch;}
body.mobile-mode #sidebar a{flex-shrink:0;padding:8px 12px;border-left:none;border-bottom:3px solid transparent;font-size:12px;white-space:nowrap;}
body.mobile-mode #sidebar a.active{border-bottom-color:var(--amber);border-left-color:transparent;background:transparent;}
body.mobile-mode #topbar{padding:0 12px;}
body.mobile-mode #topbar .brand{font-size:13px;}
body.mobile-mode #content{padding:12px;}
body.mobile-mode .page-title{font-size:18px;margin-bottom:14px;}
body.mobile-mode .grid-4{grid-template-columns:1fr 1fr;}
body.mobile-mode .grid-2{grid-template-columns:1fr;}
body.mobile-mode .card{padding:12px;}
body.mobile-mode .toolbar{flex-direction:column;align-items:stretch;gap:8px;}
body.mobile-mode .toolbar .field{min-width:0;width:100%;}
body.mobile-mode .toolbar button{width:100%;}
body.mobile-mode table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;font-size:12px;}
body.mobile-mode .stat .value{font-size:19px;}
body.mobile-mode .user-info{gap:6px;}
body.mobile-mode .user-info span.mono{display:none;}
#mobile-toggle-btn.active-mode{background:var(--amber);color:var(--navy);border-color:var(--amber);}
/* ป้องกัน iOS Safari ซูมเข้าอัตโนมัติเมื่อแตะช่องกรอก (ต้อง font-size >= 16px) */
body.mobile-mode input, body.mobile-mode select, body.mobile-mode textarea{font-size:16px !important;}
body.mobile-mode .btn{min-height:42px;}
body.mobile-mode .card-hd{flex-wrap:wrap;gap:8px;}
body.mobile-mode .btn-sm{min-height:36px;}
/* หน้า Login ต้องพอดีจอเสมอ ไม่ผูกกับ toggle เพราะต้องใช้ได้ตั้งแต่ก่อน login */
@media (max-width:480px){
  .login-box{width:92vw;padding:24px;}
}
.paste-zone label{font-size:10px;font-weight:700;color:var(--ink-dim2);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px;}
.paste-zone textarea{width:100%;background:transparent;border:none;color:var(--ink);font-family:var(--font-mono);font-size:12px;resize:vertical;min-height:70px;outline:none;line-height:1.5;}
.preview-table{margin-top:10px;}
.preview-table input{width:110px;background:var(--navy-2);border:1px solid var(--line);color:var(--ink);padding:4px 8px;border-radius:4px;font-family:var(--font-mono);font-size:12px;}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-screen">
  <div class="login-box">
    <h1>🪵 ไม้สับ</h1>
    <div class="sub">ระบบบริหารจัดการคลังไม้สับ</div>
    <div id="login-msg"></div>

    <div id="login-form">
      <div class="field"><label>Username</label><input id="li-username" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="li-password" type="password" autocomplete="current-password"></div>
      <button class="btn btn-primary" onclick="doLogin()">เข้าสู่ระบบ</button>
    </div>

    <div id="reset-form" style="display:none;">
      <div class="sub" style="margin-top:-14px;">เข้าสู่ระบบครั้งแรก กรุณาตั้งรหัสผ่านใหม่</div>
      <div class="field"><label>รหัสผ่านใหม่</label><input id="rs-new1" type="password"></div>
      <div class="field"><label>ยืนยันรหัสผ่านใหม่</label><input id="rs-new2" type="password"></div>
      <button class="btn btn-primary" onclick="doSetPassword()">ตั้งรหัสผ่านและเข้าสู่ระบบ</button>
    </div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="app-shell">
  <div id="topbar">
    <div class="brand">🪵 WOODCHIP CONTROL</div>
    <div class="user-info">
      <button class="btn btn-secondary btn-sm" id="theme-toggle-btn" onclick="toggleTheme()" title="สลับโหมดสว่าง/มืด">🌙</button>
      <button class="btn btn-secondary btn-sm" id="mobile-toggle-btn" onclick="toggleMobileMode()" title="สลับโหมดมือถือ">📱</button>
      <span id="tb-username" class="mono"></span>
      <span class="role-badge" id="tb-role"></span>
      <button class="btn btn-secondary btn-sm" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </div>
  <div id="sidebar"></div>
  <div id="content"></div>
</div>

<script>
/* ============================================================
   CONFIG
============================================================ */
const SUPABASE_URL = 'https://kkxhbglyojqcthrboeez.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtreGhiZ2x5b2pxY3RocmJvZWV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNTUzMzAsImV4cCI6MjEwMjYzMTMzMH0.WEg1gDMAe9NQE-jYVWS_Kblb-sBBqylzhu40IuyCOWY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   STATE / SESSION
============================================================ */
let SESSION = JSON.parse(localStorage.getItem('wc_session') || 'null');
let PENDING_USERNAME = null;
let SYS_CONFIG_CACHE = null;

function saveSession(s){ SESSION = s; localStorage.setItem('wc_session', JSON.stringify(s)); }
function clearSession(){ SESSION = null; localStorage.removeItem('wc_session'); }

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function rpc(fn, params={}){
  const { data, error } = await sb.rpc(fn, params);
  if(error){
    if(error.message && error.message.includes('INVALID_SESSION')){
      clearSession(); showLogin(); throw error;
    }
    throw error;
  }
  return data;
}

/* ============================================================
   LOGIN / AUTH FLOW
============================================================ */
async function doLogin(){
  const msg = document.getElementById('login-msg'); msg.innerHTML='';
  const username = document.getElementById('li-username').value.trim();
  const password = document.getElementById('li-password').value;
  if(!username || !password) return;
  try{
    const hash = await sha256(password);
    const res = await rpc('login', { p_username: username, p_password_hash: hash });
    if(res.first_login){
      PENDING_USERNAME = username;
      window._pendingOldHash = hash;
      document.getElementById('login-form').style.display='none';
      document.getElementById('reset-form').style.display='block';
      return;
    }
    saveSession(res);
    enterApp();
  }catch(e){
    msg.innerHTML = `<div class="err-msg">เข้าสู่ระบบไม่สำเร็จ: ${e.message.includes('INVALID_CREDENTIALS')?'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง':e.message}</div>`;
  }
}
async function doSetPassword(){
  const msg = document.getElementById('login-msg'); msg.innerHTML='';
  const p1 = document.getElementById('rs-new1').value;
  const p2 = document.getElementById('rs-new2').value;
  if(p1.length < 6){ msg.innerHTML='<div class="err-msg">รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร</div>'; return; }
  if(p1 !== p2){ msg.innerHTML='<div class="err-msg">รหัสผ่านไม่ตรงกัน</div>'; return; }
  try{
    const newHash = await sha256(p1);
    await rpc('set_password', { p_username: PENDING_USERNAME, p_old_hash: window._pendingOldHash, p_new_hash: newHash });
    const res = await rpc('login', { p_username: PENDING_USERNAME, p_password_hash: newHash });
    saveSession(res);
    enterApp();
  }catch(e){
    msg.innerHTML = `<div class="err-msg">เกิดข้อผิดพลาด: ${e.message}</div>`;
  }
}
function doLogout(){
  if(SESSION) rpc('logout', { p_token: SESSION.token }).catch(()=>{});
  clearSession(); location.hash=''; showLogin();
}
function showLogin(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-shell').classList.remove('active');
  document.getElementById('login-form').style.display='block';
  document.getElementById('reset-form').style.display='none';
  document.getElementById('login-msg').innerHTML='';
}
function enterApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-shell').classList.add('active');
  document.getElementById('tb-username').textContent = SESSION.username;
  document.getElementById('tb-role').textContent = SESSION.role;
  document.getElementById('tb-role').className = 'role-badge role-'+SESSION.role;
  buildSidebar();
  router();
}

/* ============================================================
   NAV / ROUTER
============================================================ */
const NAV = [
  {hash:'#dashboard', label:'ภาพรวม', icon:'📊', roles:['ENG','PUR','STO','PRD','ADMIN']},
  {hash:'#inventory', label:'สต็อกคลัง', icon:'🏭', roles:['ENG','PUR','STO','PRD','ADMIN']},
  {hash:'#chicken', label:'แผนไก่ / ขนไก่', icon:'🐔', roles:['ENG','ADMIN','PRD']},
  {hash:'#actualuse', label:'ใช้ไม้จริง', icon:'🔥', roles:['PRD','ENG','ADMIN']},
  {hash:'#purchase', label:'แผนสั่งซื้อ', icon:'🛒', roles:['PUR','ENG','ADMIN']},
  {hash:'#reconcile', label:'เทียบแผน-รับจริง', icon:'⚖️', roles:['PUR','ENG','ADMIN']},
  {hash:'#receipt', label:'บันทึกรับไม้', icon:'📥', roles:['STO','ENG','ADMIN']},
  {hash:'#steam', label:'บันทึกไอน้ำ', icon:'💨', roles:['PRD','ENG','ADMIN']},
  {hash:'#supplier', label:'กำหนดส่งของฉัน', icon:'🚚', roles:['SUP']},
  {hash:'#reports', label:'รายงาน', icon:'📈', roles:['ENG','PUR','ADMIN']},
  {hash:'#settings', label:'ตั้งค่าระบบ', icon:'⚙️', roles:['ENG','ADMIN']},
];
function buildSidebar(){
  const el = document.getElementById('sidebar');
  el.innerHTML = NAV.filter(n=>n.roles.includes(SESSION.role))
    .map(n=>`<a href="${n.hash}" data-hash="${n.hash}"><span>${n.icon}</span>${n.label}</a>`).join('');
}
window.addEventListener('hashchange', router);
function router(){
  if(!SESSION){ showLogin(); return; }
  let h = location.hash || defaultHashFor(SESSION.role);
  const allowed = NAV.find(n=>n.hash===h && n.roles.includes(SESSION.role));
  if(!allowed){ h = defaultHashFor(SESSION.role); location.hash = h; }
  document.querySelectorAll('#sidebar a').forEach(a=>a.classList.toggle('active', a.getAttribute('data-hash')===h));
  const page = h.replace('#','');
  const renderFn = { dashboard:renderDashboard, inventory:renderInventory, chicken:renderChicken,
    actualuse:renderActualUse, purchase:renderPurchase, reconcile:renderReconcile, receipt:renderReceipt, steam:renderSteam, supplier:renderSupplierView,
    reports:renderReports, settings:renderSettings }[page];
  document.getElementById('content').innerHTML = '<div class="loading-box"><div class="spin"></div>กำลังโหลด...</div>';
  if(renderFn) safeRender(renderFn);
}
// ป้องกันหน้าค้างที่ "กำลังโหลด..." ตลอดไปเมื่อ RPC error — โชว์ข้อความ error แทน
async function safeRender(fn){
  try{
    await fn();
  }catch(e){
    console.error(e);
    document.getElementById('content').innerHTML =
      `<div class="err-msg">โหลดข้อมูลไม่สำเร็จ: ${(e && e.message) || e}<br>
       <button class="btn btn-secondary btn-sm" style="margin-top:10px;" onclick="router()">ลองใหม่</button></div>`;
  }
}

function fmt(n,d=0){ return n==null ? '-' : Number(n).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d}); }
// SEC หน่วยสากล: GJ พลังงานไอน้ำ ÷ ตันวัตถุดิบ (แปลงมวลไอน้ำ→พลังงานด้วย Enthalpy ที่ตั้งค่าไว้) — ค่าฐานเสมอเป็น GJ/ตัน
function secGJperTonne(steamKg, rawKg, enthalpyKJkg){
  if(!steamKg || !rawKg || rawKg<=0) return null;
  const energyGJ = (steamKg * (enthalpyKJkg||2773)) / 1e6;
  const rawTonnes = rawKg / 1000;
  return rawTonnes>0 ? energyGJ/rawTonnes : null;
}
// เลือกหน่วยแสดงผล SEC: GJ/ตัน หรือ MJ/ตัน (จำค่าที่เลือกไว้ ใช้ร่วมกันทุกหน้า)
function getSecUnit(){ return localStorage.getItem('wc_sec_unit') || 'GJ'; }
function setSecUnit(u){ localStorage.setItem('wc_sec_unit', u); refreshSecDisplays(); }

function secDisplay(gjPerTonne){ if(gjPerTonne==null) return null; return getSecUnit()==='MJ' ? gjPerTonne*1000 : gjPerTonne; }
function secDecimals(){ return getSecUnit()==='MJ' ? 1 : 3; }

  </select>`;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysAgoISO(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function isoWeek(dateStr){
  const d = new Date(dateStr+'T00:00:00'); d.setHours(0,0,0,0);
  d.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const week1 = new Date(d.getFullYear(),0,4);
  const wn = 1+Math.round(((d-week1)/86400000-3+((week1.getDay()+6)%7))/7);
  return `${d.getFullYear()}-W${String(wn).padStart(2,'0')}`;
}
function calcWoodLocal(chickenKg, feathersKg, cfg){
  cfg = cfg || {};
  const pctF = cfg.PCT_FEATHER_BONE ?? 0.21575, pctI = cfg.PCT_INTESTINE ?? 0.045;
  const fC = cfg.FACTOR_CHICKEN ?? 0.056, fF = cfg.FACTOR_FEATHER ?? 0.5847, fI = cfg.FACTOR_INTESTINE ?? 0.9279;
  const A = cfg.FORMULA_A ?? -0.000002388, B = cfg.FORMULA_B ?? 0.6147, C = cfg.FORMULA_C ?? 22141;
  const g1 = chickenKg*fC, g2=(chickenKg*pctF+feathersKg)*fF, g3=(chickenKg*pctI)*fI;
  const X = g1+g2+g3;
  return Math.max(0, A*X*X + B*X + C);
}
async function getConfigMap(){
  if(SYS_CONFIG_CACHE) return SYS_CONFIG_CACHE;
  const rows = await rpc('get_sys_config', { p_token: SESSION.token }).catch(()=>[]);
  const map = {};
  rows.forEach(r=>map[r.key]=parseFloat(r.value));
  SYS_CONFIG_CACHE = map;
  return map;
}

function parsePastedSheet(text, cols){
  // cols: จำนวนคอลัมน์ที่ต้องการ (2, 3 หรือ 4)
  // สำคัญ: ต้องแยกด้วย Tab ก่อนเสมอ (แบบที่ Google Sheets คั่นคอลัมน์)
  // ห้าม split ด้วย comma ปนกัน เพราะตัวเลขในชีทมี comma คั่นหลักพัน (เช่น 186,502.00)
  // ถ้า split ด้วย comma ไปด้วยจะตัดตัวเลขให้ขาดกลางคัน (อ่านได้แค่ 3 หลักแรก)
  const rows = [];
  text.split('\n').forEach(line=>{
    line = line.trim(); if(!line) return;
    const parts = (line.includes('\t') ? line.split('\t') : line.split(','))
      .map(s=>s.trim());
    if(parts.length < 2) return;
    const d = parseFlexDate(parts[0]);
    const v = parseFloat((parts[1]||'').replace(/,/g,''));
    if(!d || isNaN(v)) return;
    const row = { date:d, value:v };
    if(cols>=3) row.extra = parts[2] || '';
    if(cols>=4) row.extra2 = parts[3] || '';
    rows.push(row);
  });
  return rows;
}
function parseFlexDate(s){
  s = (s||'').trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return null;
}

}

/* ============================================================
   3D WOOD PILE VISUALIZATION (Three.js)
   จำลองกองไม้สับในลาน ขนาดปรับตาม % สต็อกจริง หมุนช้าๆ อัตโนมัติ
============================================================ */
function initWoodPile3D(pct){
  const container = document.getElementById('pile3d-container');
  if(!container || typeof THREE === 'undefined') return;

  // เคลียร์ scene เก่า (กันหน่วยความจำรั่วตอน re-render หน้า)
  if(window._pile3d && window._pile3d.raf) cancelAnimationFrame(window._pile3d.raf);
  if(window._pile3d && window._pile3d.renderer) window._pile3d.renderer.dispose();
  container.innerHTML = '';

  const isLight = document.body.classList.contains('light-theme');
  const w = container.clientWidth || 400, h = container.clientHeight || 260;

  const scene = new THREE.Scene();
  scene.background = null;

  const camera = new THREE.PerspectiveCamera(40, w/h, 0.1, 100);
  camera.position.set(0, 3.6, 8.5);
  camera.lookAt(0, 0.5, 0);

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  container.appendChild(renderer.domElement);

  // พื้นลาน (วงกลม = ขอบเขตพื้นที่ 400 ตัน)
  const groundGeo = new THREE.CircleGeometry(4.2, 48);
  const groundMat = new THREE.MeshStandardMaterial({ color: isLight?0xd7dde5:0x1b3a56, roughness:0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  // เส้นขอบลานแบบ wireframe (บอกขอบเขตความจุเต็ม 100%)
  const ringGeo = new THREE.RingGeometry(4.15, 4.25, 48);
  const ringMat = new THREE.MeshBasicMaterial({ color:0xf59e0b, side:THREE.DoubleSide, transparent:true, opacity:0.5 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI/2;
  ring.position.y = 0.01;
  scene.add(ring);

  // กองไม้สับ: ทรงกรวยไม่เรียบ (แทนกองจริง) สเกลตาม %สต็อก (ปริมาตร ∝ pct)
  const scaleFactor = Math.max(0.12, Math.min(1, Math.cbrt(Math.max(pct,1)/100)));
  const baseRadius = 3.4, baseHeight = 2.6;
  const pileGeo = new THREE.ConeGeometry(baseRadius*scaleFactor, baseHeight*scaleFactor, 10, 4);
  // ทำให้ผิวกองไม่เรียบเป๊ะ ดูเป็นกองจริงมากขึ้น
  const posAttr = pileGeo.attributes.position;
  for(let i=0;i<posAttr.count;i++){
    const y = posAttr.getY(i);
    if(y < baseHeight*scaleFactor*0.45){ // เฉพาะฐานกอง ไม่แตะยอด
      const n = (Math.sin(i*12.9898)*43758.5453) % 1;
      const jitter = (n - 0.5) * 0.18 * scaleFactor;
      posAttr.setX(i, posAttr.getX(i) + jitter);
      posAttr.setZ(i, posAttr.getZ(i) + jitter);
    }
  }
  pileGeo.computeVertexNormals();
  const pileMat = new THREE.MeshStandardMaterial({ color:0xb5651d, roughness:1, flatShading:true });
  const pile = new THREE.Mesh(pileGeo, pileMat);
  pile.position.y = (baseHeight*scaleFactor)/2;
  scene.add(pile);

  // แสง
  scene.add(new THREE.AmbientLight(0xffffff, isLight?0.7:0.45));
  const dLight = new THREE.DirectionalLight(0xffffff, isLight?0.7:0.9);
  dLight.position.set(4, 6, 3);
  scene.add(dLight);
  const dLight2 = new THREE.DirectionalLight(0xf59e0b, 0.25);
  dLight2.position.set(-3, 2, -2);
  scene.add(dLight2);

  let frame = 0;
  function animate(){
    frame += 0.006;
    pile.rotation.y += 0.0025; // หมุนช้าๆ
    pile.position.y = (baseHeight*scaleFactor)/2 + Math.sin(frame)*0.03; // หายใจเบาๆ
    renderer.render(scene, camera);
    window._pile3d.raf = requestAnimationFrame(animate);
  }
  window._pile3d = { renderer, raf:null };
  animate();
}

async function loadInventoryTable(){

  const maxStock = cfg.MAX_STOCK_KG || 400000;

  document.querySelector('#inv-table tbody').innerHTML = (rows||[]).map(r=>{

    const adj = r.adjustment_kg || 0;
    return `<tr><td>${r.inv_date}</td><td>${fmt(r.opening_stock_kg)}</td><td>${fmt(r.received_kg)}</td>

async function saveStockAdjustment(){

async function confirmActualUseImport(n){
  const btn = document.getElementById('au-import-btn'); const status = document.getElementById('au-import-status');
  btn.disabled = true; btn.textContent = 'กำลังนำเข้า...';
  let ok=0, failed=[];
  for(let i=0;i<n;i++){
    const row = window._auPasteRows[i];
    status.textContent = `กำลังบันทึก ${i+1}/${n} (${row.date})...`;
    const val = parseFloat(document.getElementById('aup-'+i).value || 0);
    try{ await rpc('save_actual_wood_usage', { p_token: SESSION.token, p_date: row.date, p_actual_wood_kg: val }); ok++; }catch(e){ failed.push(row.date+': '+e.message); }

    ? `<div class="ok-msg">✅ นำเข้าสำเร็จครบทั้ง ${ok} แถว</div>`

async function loadActualUseTable(){
  const from = document.getElementById('au-from').value, to = document.getElementById('au-to').value;
  const rows = await rpc('get_dashboard_data', { p_token: SESSION.token, p_date_from: from, p_date_to: to });
  window._chickenByDate = {}; (rows.chicken_plan||[]).forEach(r=>window._chickenByDate[r.plan_date]=r);
  document.querySelector('#au-table tbody').innerHTML = (rows.chicken_plan||[]).map(r=>{
    const hasActual = r.actual_wood_kg!=null;
    const diff = hasActual ? r.actual_wood_kg - r.calc_wood_kg : null;
    return `<tr><td>${r.plan_date}</td><td>${fmt(r.calc_wood_kg)}</td>
    <td style="${hasActual?'color:var(--green);font-weight:700;':'color:var(--ink-dim2);'}">${hasActual?fmt(r.actual_wood_kg):'-'}</td>
    <td style="${diff==null?'':diff>0?'color:var(--red);':'color:var(--green);'}">${diff==null?'-':(diff>0?'+':'')+fmt(diff)}</td>
    <td>${hasActual?'<span class="badge badge-ok">จริง</span>':'<span class="badge badge-info">ประมาณการ</span>'}</td>
    <td>${r.actual_recorded_by||r.recorded_by||''}</td>
    <td style="white-space:nowrap;">
      <button class="row-del" onclick="editActualUseRow('${r.plan_date}')" title="แก้ไขแถวนี้">✏️</button>
      ${hasActual?`<button class="row-del" onclick="clearActualUse('${r.plan_date}')" title="ล้างยอดจริง กลับไปใช้ประมาณการ">↺</button>`:''}
    </td></tr>`;
  }).join('') || '<tr><td colspan="7">ไม่มีข้อมูล</td></tr>';
}
function editActualUseRow(date){
  const r = window._chickenByDate ? window._chickenByDate[date] : null;
  document.getElementById('au-date').value = date;
  if(r && r.actual_wood_kg!=null) document.getElementById('au-kg').value = r.actual_wood_kg;

async function clearActualUse(date){
  if(!confirm(`ยืนยันล้างยอดใช้จริงของวันที่ ${date}? ระบบจะกลับไปใช้ค่าประมาณการตัดสต็อกแทน`)) return;
  try{
    await rpc('clear_actual_wood_usage', { p_token: SESSION.token, p_date: date });
    loadActualUseTable();
  }catch(e){ alert('ล้างยอดไม่สำเร็จ: ' + e.message); }

async function renderReconcile(){
  document.getElementById('content').innerHTML = `

}
async function loadReconcile(){
  const from = document.getElementById('rc-from').value, to = document.getElementById('rc-to').value;
  const [detail, summary, suppliers] = await Promise.all([
    rpc('get_reconciliation_detail', { p_token: SESSION.token, p_date_from: from, p_date_to: to }),
    rpc('get_reconciliation_summary', { p_token: SESSION.token, p_date_from: from, p_date_to: to }),
    loadSuppliers()
  ]);

  // สร้างหัวตารางแบบ dynamic ตามจำนวนซัพพลายเออร์
  const theadHtml = `<tr>
    <th rowspan="2">วันที่</th><th rowspan="2">นน.ไก่เข้า (กก.)</th>
    ${suppliers.map(s=>`<th colspan="2">${s.name}</th>`).join('')}
    <th rowspan="2">รวมไม้ที่มาจริง (กก.)</th><th rowspan="2">ประมาณการใช้ (กก.)</th><th rowspan="2">ใช้จริง (กก.)</th><th rowspan="2">ไม้คงเหลือ (กก.)</th>
    </tr><tr>${suppliers.map(()=>`<th>แผน (กก.)</th><th>ส่งจริง (กก.)</th>`).join('')}</tr>`;
  document.getElementById('rc-thead').innerHTML = theadHtml;

  // index รายละเอียดต่อซัพพลายเออร์ด้วย key = date|supplier_id
  const detailMap = {};
  (detail||[]).forEach(d=>{ detailMap[d.the_date+'|'+d.supplier_id] = d; });

  document.getElementById('rc-tbody').innerHTML = (summary||[]).map(r=>{
    const supplierCells = suppliers.map(s=>{
      const d = detailMap[r.the_date+'|'+s.id];
      const planned = d ? d.planned_kg : 0, received = d ? d.received_kg : 0;
      return `<td>${planned>0?fmt(planned):'-'}</td><td>${received>0?fmt(received):'-'}</td>`;
    }).join('');
    const closingNeg = r.closing_stock_kg!=null && r.closing_stock_kg < 0;
    return `<tr><td>${r.the_date}</td><td>${fmt(r.chicken_kg)}</td>${supplierCells}
      <td>${fmt(r.total_received_kg)}</td><td>${fmt(r.calc_wood_kg)}</td>
      <td style="${r.actual_wood_kg!=null?'color:var(--green);font-weight:700;':'color:var(--ink-dim2);'}">${r.actual_wood_kg!=null?fmt(r.actual_wood_kg):'-'}</td>
      <td style="${closingNeg?'color:var(--red);font-weight:700;':'color:var(--amber);font-weight:700;'}">${r.closing_stock_kg!=null?fmt(r.closing_stock_kg):'-'}</td></tr>`;
  }).join('') || `<tr><td colspan="${4+suppliers.length*2}">ไม่มีข้อมูลในช่วงนี้</td></tr>`;
}

async function loadSteamTable(){
  const from = document.getElementById('st-from').value, to = document.getElementById('st-to').value;
  const [steamRows, ck, cfg] = await Promise.all([
    rpc('get_steam_usage', { p_token: SESSION.token, p_date_from: from, p_date_to: to }),
    rpc('get_dashboard_data', { p_token: SESSION.token, p_date_from: from, p_date_to: to }),
    getConfigMap()
  ]);
  const pctFeatherBone = cfg.PCT_FEATHER_BONE ?? 0.21575, pctIntestine = cfg.PCT_INTESTINE ?? 0.045;
  const chickenMap = {}; (ck.chicken_plan||[]).forEach(c=>chickenMap[c.plan_date]={
    chicken:c.planned_chicken_kg, feathers:c.purchased_feathers_kg||0,
    hasBones: c.has_bones!==false, hasFeathers: c.has_feathers!==false
  });
  window._steamById = {}; (steamRows||[]).forEach(r=>window._steamById[r.id]=r);

  document.querySelector('#st-table tbody').innerHTML = (steamRows||[]).map(r=>{
    const cp = chickenMap[r.usage_date];
    const chickenKg = cp ? cp.chicken : null;
    const srnBase = cp ? ((cp.hasBones?cp.chicken*pctFeatherBone:0) + (cp.hasFeathers?cp.feathers:0)) : null;
    const slhBase = chickenKg;
    const proteinBase = cp ? (cp.chicken*pctIntestine) : null;
    const secSrn = secGJperTonne(r.steam_srn_kg, srnBase, cfg.STEAM_ENTHALPY_KJ_KG);
    const secSlh = secGJperTonne(r.steam_slh_kg, slhBase, cfg.STEAM_ENTHALPY_KJ_KG);
    const secProtein = secGJperTonne(r.steam_protein_kg, proteinBase, cfg.STEAM_ENTHALPY_KJ_KG);
    return `<tr><td>${r.usage_date}</td><td>${fmt(r.steam_srn_kg)}</td><td>${fmt(r.steam_slh_kg)}</td><td>${fmt(r.steam_protein_kg)}</td>
    <td style="font-weight:700;">${fmt(r.steam_kg)}</td><td>${chickenKg?fmt(chickenKg):'-'}</td>
    <td style="color:var(--purp);">${secSrn?fmt(secDisplay(secSrn),secDecimals()):'-'}</td>
    <td style="color:var(--purp);">${secSlh?fmt(secDisplay(secSlh),secDecimals()):'-'}</td>
    <td style="color:var(--purp);">${secProtein?fmt(secDisplay(secProtein),secDecimals()):'-'}</td>
    <td>${r.recorded_by||''}</td>
    <td style="white-space:nowrap;">
      <button class="row-del" onclick="editSteamRow('${r.id}')" title="แก้ไขแถวนี้">✏️</button>
      <button class="row-del" onclick="deleteRow('steam_usage','${r.id}')" title="ลบแถวนี้">✕</button>
    </td></tr>`;
  }).join('') || '<tr><td colspan="11">ไม่มีข้อมูล</td></tr>';
}
function editSteamRow(id){
  const r = window._steamById ? window._steamById[id] : null;
  if(!r) return;
  document.getElementById('st-date').value = r.usage_date;
  document.getElementById('st-srn').value = r.steam_srn_kg;
  document.getElementById('st-slh').value = r.steam_slh_kg;
  document.getElementById('st-protein').value = r.steam_protein_kg;

}

const ROLE_ALIAS = {
  'ENG':'ENG','PUR':'PUR','STO':'STO','PRD':'PRD','ADMIN':'ADMIN',
  'PROD':'PRD','PRODUCTION':'PRD','PURCHASE':'PUR','PURCHASING':'PUR','STORE':'STO','STOCK':'STO','ENGINEER':'ENG','ENGINEERING':'ENG',

};
const VALID_ROLES = ['ENG','PUR','STO','PRD','ADMIN'];
function normalizeRole(v){
  const key = (v||'').trim();
  return ROLE_ALIAS[key] || ROLE_ALIAS[key.toUpperCase()] || key.toUpperCase();
}

function previewUserPaste(){
  document.getElementById('nu-msg').innerHTML='';
  const lines = document.getElementById('nu-paste').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows = [];
  lines.forEach(line=>{
    const parts = (line.includes('\t') ? line.split('\t') : line.split(',')).map(s=>s.trim());
    if(parts.length < 4) return;
    rows.push({ code:parts[0], name:parts[1], dept:parts[2], role:normalizeRole(parts[3]), rawRole:parts[3] });
  });
  const box = document.getElementById('nu-preview');
  if(!rows.length){ box.innerHTML = '<div class="err-msg">ไม่พบข้อมูลที่แปลงได้ — ต้องมีครบ 4 คอลัมน์ (รหัส/ชื่อ/แผนก/บทบาท) คั่นด้วย Tab แล้วกด "ดูตัวอย่าง" ก่อนทุกครั้ง</div>'; return; }
  const invalidCount = rows.filter(r=>!VALID_ROLES.includes(r.role)).length;
  box.innerHTML = `<div class="hint">พบ ${rows.length} แถว${invalidCount?` — <span style="color:var(--red);font-weight:700;">⚠️ ${invalidCount} แถวมีบทบาทที่ระบบไม่รู้จัก (ไฮไลต์สีแดง) กรุณาแก้ในช่อง dropdown ก่อนกดยืนยัน</span>`:''}:</div>
    <div class="preview-table"><table><thead><tr><th>รหัสพนักงาน</th><th>ชื่อ-สกุล</th><th>แผนก</th><th>บทบาท</th></tr></thead>
    <tbody>${rows.map((r,i)=>{
      const isInvalid = !VALID_ROLES.includes(r.role);
      return `<tr><td><input type="text" id="nup-code-${i}" value="${r.code}"></td><td><input type="text" id="nup-name-${i}" value="${r.name}"></td><td><input type="text" id="nup-dept-${i}" value="${r.dept}"></td>
    <td><select id="nup-role-${i}" style="${isInvalid?'border-color:var(--red);':''}">
      ${isInvalid?`<option value="" selected disabled>⚠️ "${r.rawRole}" ไม่รู้จัก — เลือกใหม่</option>`:''}
      <option value="ENG"${r.role==='ENG'?' selected':''}>ENG</option><option value="PUR"${r.role==='PUR'?' selected':''}>PUR</option><option value="STO"${r.role==='STO'?' selected':''}>STO</option><option value="PRD"${r.role==='PRD'?' selected':''}>PRD</option><option value="ADMIN"${r.role==='ADMIN'?' selected':''}>ADMIN</option></select></td></tr>`;
    }).join('')}</tbody></table>
    <button class="btn btn-primary btn-sm" id="nu-import-btn" style="margin-top:10px;" onclick="confirmUserImport(${rows.length})">ยืนยันนำเข้า ${rows.length} คน</button>
    <div id="nu-import-status" class="hint"></div></div>`;
}
async function confirmUserImport(n){
  const btn = document.getElementById('nu-import-btn'); const status = document.getElementById('nu-import-status');
  btn.disabled = true; btn.textContent = 'กำลังนำเข้า...';
  let ok=0, failed=[];
  for(let i=0;i<n;i++){
    const code = document.getElementById('nup-code-'+i).value.trim();
    const name = document.getElementById('nup-name-'+i).value.trim();
    const dept = document.getElementById('nup-dept-'+i).value.trim();
    const role = document.getElementById('nup-role-'+i).value;
    if(!role){ failed.push(code+': ยังไม่ได้เลือกบทบาทที่ถูกต้อง (ข้ามแถวนี้)'); continue; }
    status.textContent = `กำลังบันทึก ${i+1}/${n} (${code})...`;
    try{
      await rpc('manage_user', { p_token: SESSION.token, p_id: null, p_username: code, p_full_name: name, p_department: dept, p_role: role, p_supplier_id: null });
      ok++;
    }catch(e){ failed.push(code+': '+e.message); }
  }
  document.getElementById('nu-preview').innerHTML = ok===n
    ? `<div class="ok-msg">✅ นำเข้าสำเร็จครบทั้ง ${ok} คน (รหัสผ่านตั้งต้น 123456789 ทุกคน)</div>`
    : `<div class="err-msg">นำเข้าสำเร็จ ${ok}/${n} คน — ล้มเหลว:<br>${failed.join('<br>')}</div>`;
  document.getElementById('nu-paste').value='';
  refreshUsersList();
}
async function resetUserPw(username){
  if(!confirm(`ยืนยันรีเซ็ตรหัสผ่านของ ${username} เป็น 123456789?`)) return;
  try{
    await rpc('reset_user_password', { p_token: SESSION.token, p_username: username });
    alert('รีเซ็ตรหัสผ่านเป็น 123456789 แล้ว — ผู้ใช้จะถูกบังคับตั้งรหัสใหม่ตอน login ครั้งถัดไป');
  }catch(e){ alert('รีเซ็ตไม่สำเร็จ: ' + e.message); }
}


/* ============================================================
   DELETE (range + per-row)
============================================================ */
async function deleteRange(table, fromId, toId){
  const from = document.getElementById(fromId).value, to = document.getElementById(toId).value;
  if(!confirm(`ยืนยันลบข้อมูลตั้งแต่ ${from} ถึง ${to}? (ตอนนี้กู้คืนได้ในภายหลังผ่าน ตั้งค่า → ประวัติการลบ)`)) return;
  try{
    const res = await rpc('delete_records', { p_token: SESSION.token, p_table: table, p_date_from: from, p_date_to: to });
    alert(`ลบข้อมูล ${res.deleted_count} แถวเรียบร้อย — กู้คืนได้ที่ ตั้งค่า → ประวัติการลบ`);
    router();
  }catch(e){ alert('ลบไม่สำเร็จ: ' + e.message); }
}
async function deleteRow(table, id){
  if(!confirm('ยืนยันลบแถวนี้? (กู้คืนได้ภายหลังผ่าน ตั้งค่า → ประวัติการลบ)')) return;
  try{
    await rpc('delete_record_by_id', { p_token: SESSION.token, p_table: table, p_id: id });
    router();
  }catch(e){ alert('ลบไม่สำเร็จ: ' + e.message); }
}

/* ============================================================
   INIT
============================================================ */
(function init(){
  if(SESSION && SESSION.token){ enterApp(); } else { showLogin(); }
})();
</script>
